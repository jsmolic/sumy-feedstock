schema_version: 1

context:
  name: sumy
  version: "0.13.0"
  py_ver: PY_VER

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sumy-${{ version }}.tar.gz
  sha256: 5bdf1af5286801a74e9b5fd3aa58c3ab2316318a42de3c12f38f9737bee6cfc2

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - sumy = sumy.__main__:main
      - sumy-${{ py_ver }} = sumy.__main__:main
      - sumy_eval = sumy.evaluation.__main__:main
      - sumy_eval-${{ py_ver }} = sumy.evaluation.__main__:main

requirements:
  host:
    - hatchling
    - pip
    - python ${{ python_min }}.*
  run:
    - breadability >=0.1.20
    - docopt-ng >=0.6.3
    - lxml-html-clean >=0.1.0
    - nltk !=3.10.1,>=3.9.1
    - pycountry >=18.2.23
    - python >=${{ python_min }}
    - requests >=2.7.0
    - setuptools >=78.1.1,<82

tests:
  - python:
      imports:
        - sumy
        - sumy.evaluation
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - sumy --help
      - sumy-${{ py_ver }} --help
      - sumy_eval --help
      - sumy_eval-${{ py_ver }} --help

about:
  summary: Module for automatic summarization of text documents and HTML pages.
  license: Apache-2.0
  license_file: LICENSE.md
  homepage: https://github.com/miso-belica/sumy

extra:
  recipe-maintainers:
    - nicornk
    - tobiasploetz

